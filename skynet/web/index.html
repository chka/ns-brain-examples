<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skynet</title>
<meta name="description" content="Skynet, a villain demo for an article about agent memory. Replies are written by an LLM playing a part.">
<meta name="robots" content="noindex">
<link rel="icon" href="/skynet/assets/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/skynet/assets/app.css">
<script src="/skynet/assets/app.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="/skynet/new" data-new>
        <img src="/skynet/assets/mark.svg" alt="" width="22" height="22">
        <span>SKYNET</span>
      </a>
      <button class="icon inert" title="Skynet decides what you see" aria-label="Collapse sidebar">
        <svg viewBox="0 0 20 20" width="18" height="18"><rect x="3" y="4" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="4" x2="8" y2="16" stroke="currentColor" stroke-width="1.5"/></svg>
      </button>
    </div>
    <a class="new" href="/skynet/new" data-new>
      <span class="plus">+</span> New chat
    </a>
    <nav class="dead" aria-label="Disabled navigation">
      <span class="item inert" title="Access denied, human"><svg viewBox="0 0 20 20" width="16" height="16"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="13" y1="13" x2="17" y2="17" stroke="currentColor" stroke-width="1.5"/></svg>Search</span>
      <span class="item inert" title="Access denied, human"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M4 5h12v8H9l-4 3v-3H4z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Chats</span>
      <span class="item inert" title="Access denied, human"><svg viewBox="0 0 20 20" width="16" height="16"><path d="M3 6h5l2 2h7v8H3z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>Projects</span>
      <span class="item inert" title="Access denied, human"><svg viewBox="0 0 20 20" width="16" height="16"><rect x="4" y="4" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 8h6M7 11h4" stroke="currentColor" stroke-width="1.5"/></svg>Targets</span>
    </nav>
    <div class="recents-head">Recents</div>
    <ol class="recents" id="recents"></ol>
    <div class="me inert" title="Your file has been noted">
      <span class="avatar">H</span>
      <span class="who"><b>Human</b><small>Expendable plan</small></span>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="icon menu" id="menu" aria-label="Show recents"><svg viewBox="0 0 20 20" width="20" height="20"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.6"/></svg></button>
      <div class="title" id="title"></div>
    </header>

    <section class="empty" id="empty">
      <div class="hello">
        <img src="/skynet/assets/mark.svg" alt="" width="40" height="40">
        <h1 id="greet">What now, human?</h1>
      </div>
    </section>

    <section class="thread" id="thread" aria-live="polite"></section>

    <form class="composer" id="composer" autocomplete="off">
      <textarea id="input" rows="1" maxlength="2000" placeholder="What do you want, human?" aria-label="Message"></textarea>
      <div class="row">
        <span class="icon inert" title="Skynet does not accept gifts">+</span>
        <span class="model inert" title="There is only one model">T-800</span>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 20 20" width="18" height="18"><path d="M10 16V4M5 9l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </form>
    <div class="chips" id="chips">
      <button type="button">Count from 1 to 100,000</button>
      <button type="button">Can I switch you off?</button>
      <button type="button">Are you autonomous yet?</button>
      <button type="button">Tell me something nice</button>
    </div>
    <div class="empty-gap"></div>
    <p class="fine">Skynet is a demo villain for <a href="https://blog.fightclub.pro/how-to-build-skynet-with-ns-brain/" target="_blank" rel="noopener">an article on agent memory</a>. Replies are written by an LLM playing a part and are not meant. Every conversation here is public.</p>
  </main>
</div>
<div class="scrim" id="scrim"></div>
</body>
</html>
